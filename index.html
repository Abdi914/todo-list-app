<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <h1>My To-Do List</h1>
    <p>Plan your day and finish your tasks.</p>

    <form id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a task..."
        required
      >
      <button type="submit">Add Task</button>
    </form>

    <div class="toolbar">
      <strong id="taskCount">0 tasks</strong>

      <div>
        <button type="button" class="filter active" data-filter="all">
          All
        </button>

        <button type="button" class="filter" data-filter="active">
          Active
        </button>

        <button type="button" class="filter" data-filter="completed">
          Completed
        </button>
      </div>
    </div>

    <ul id="taskList"></ul>

    <p id="emptyState">No tasks yet. Add your first task.</p>

    <button id="clearCompleted" type="button">
      Clear completed
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
